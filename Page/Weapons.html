<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valorant - Weapons</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Css/style.css">
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="logo">VALORANT</div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="Agent.html">Agents</a></li>
            <li><a href="Weapons.html">Weapons</a></li>
        </ul>
    </nav>

    <!-- Weapons Content -->
    <section class="armory-section">
        <div class="armory-container">
            
            <!-- Left Column: Categories -->
            <aside class="armory-sidebar">
                <h2 class="sidebar-title">Categories</h2>
                <ul class="category-list">
                    <li><a href="#" class="category-link">Sidearms</a></li>
                    <li><a href="#" class="category-link">SMGs</a></li>
                    <li><a href="#" class="category-link active">Rifles</a></li>
                    <li><a href="#" class="category-link">Sniper Rifles</a></li>
                    <li><a href="#" class="category-link">Heavy</a></li>
                </ul>
            </aside>

            <!-- Right Column: Weapon Cards -->
            <main class="armory-content">
                <h2 class="category-header">Rifles</h2>
                
                <div class="weapon-grid">
                    <!-- Weapon Card: Vandal -->
                    <div class="weapon-card">
                        <div class="weapon-image-container">
                            <img src="https://media.valorant-api.com/weapons/9c82e19d-4575-0200-1a81-3eacf00cf872/displayicon.png" alt="Vandal">
                        </div>
                        <div class="weapon-info">
                            <h3>Vandal</h3>
                            <div class="weapon-stats">
                                <div class="stat">
                                    <span>Damage</span>
                                    <div class="stat-bar-bg"><div class="stat-bar-fill" style="width: 85%;"></div></div>
                                </div>
                                <div class="stat">
                                    <span>Fire Rate</span>
                                    <div class="stat-bar-bg"><div class="stat-bar-fill" style="width: 70%;"></div></div>
                                </div>
                                <div class="stat">
                                    <span>Magazine</span>
                                    <div class="stat-bar-bg"><div class="stat-bar-fill" style="width: 25%;"></div></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Weapon Card: Phantom -->
                    <div class="weapon-card">
                        <div class="weapon-image-container">
                            <img src="https://media.valorant-api.com/weapons/ee8e8d15-496b-07ac-e5f6-8fae5d4c7b1a/displayicon.png" alt="Phantom">
                        </div>
                        <div class="weapon-info">
                            <h3>Phantom</h3>
                            <div class="weapon-stats">
                                <div class="stat">
                                    <span>Damage</span>
                                    <div class="stat-bar-bg"><div class="stat-bar-fill" style="width: 75%;"></div></div>
                                </div>
                                <div class="stat">
                                    <span>Fire Rate</span>
                                    <div class="stat-bar-bg"><div class="stat-bar-fill" style="width: 80%;"></div></div>
                                </div>
                                <div class="stat">
                                    <span>Magazine</span>
                                    <div class="stat-bar-bg"><div class="stat-bar-fill" style="width: 30%;"></div></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2026 Valorant Showcase. All rights reserved.</p>
    </footer>

</body>
</html>
